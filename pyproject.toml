[project]
name = "open-in-pandas"
version = "1.0.0"
description = "Open data files in an interactive Python session from the command line or Windows Explorer."
readme = "README.md"
authors = [
    { name = "Zach Strout", email = "zachstrout@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "context-menu>=1.4.1",
    "ezc3d>=1.7.0",
    "h5py>=3.16.0",
    "ipython>=9.13.0",
    "matplotlib>=3.10.9",
    "mplcursors>=0.7.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
]

[project.scripts]
oi = "open_in_pandas:main"

[build-system]
requires = ["uv_build>=0.8.23,<0.9.0"]
build-backend = "uv_build"
